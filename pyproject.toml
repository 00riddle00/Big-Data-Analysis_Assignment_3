[project]
name = "venv"
version = "0.1.0"
description = "Scalable Maritime AIS Noise Filtering and Temporal Analysis with MongoDB Sharding."
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "matplotlib>=3.10.9",
    "pymongo>=4.17.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.black]
line-length = 88
preview = true
enable-unstable-feature = ["string_processing"]
